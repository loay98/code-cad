
[project]
name = "code-cad"
version = "0.1.0"
description = "Parametric mechanical CAD using build123d"
requires-python = ">=3.14"
dependencies = [
    "build123d",
    "ocp-vscode",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py314"
